name: Rename new version to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new version
        run: |
          git config user.name "517998145kk-gif"
          git config user.email "517998145kk@gmail.com"
          git rm -q index.html
          git mv ai-shi-pin-gong-zuo-liu-kong-jian-gong-kai-ban.html index.html
          git status --short
          ls -l index.html
          git commit -m "Backfill prompt library: 175 full / 28 partial / 1 excerpt"
          git push
